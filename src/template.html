<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<title>Colección de Vinilos — Café de Ley</title>
<style>
@font-face {
  font-family: 'Work Sans';
  src: url(assets/fonts/work-sans-1f8c41.woff2) format('woff2');
  font-weight: 100 900;
  font-display: swap;
}

:root {
  --paper: #f6f6f3;
  --paper-alt: #eeefed;
  --card: #ffffff;
  --ink: #191b1b;
  --ink-soft: #565c5e;
  --ink-faint: #7c8386;
  --line: rgba(35,45,48,0.12);
  --line-strong: rgba(35,45,48,0.21);
  --glass-fill: rgba(255,255,255,0.56);
  --glass-fill-strong: rgba(255,255,255,0.86);
  --glass-line: rgba(255,255,255,0.94);
  --glass-highlight: rgba(255,255,255,1);
  --shadow-soft: rgba(41,49,53,0.09);
  --shadow-strong: rgba(41,49,53,0.17);
}

* { box-sizing: border-box; }

html, body {
  color: var(--ink);
  font-family: 'Work Sans', system-ui, sans-serif;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}
html { background: var(--paper); scroll-behavior: smooth; }
body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse 44% 30% at 13% 23%, rgba(215,230,244,.55), transparent 95%),
    radial-gradient(ellipse 40% 30% at 86% 58%, rgba(226,220,245,.46), transparent 95%),
    radial-gradient(ellipse 44% 32% at 49% 89%, rgba(255,218,188,.42), transparent 95%),
    linear-gradient(180deg, #f3f5f4, #faf9f7 48%, #f3f4f2);
  background-attachment: fixed;
}
button, input, select { font: inherit; }

::selection { background: var(--ink); color: var(--paper); }

.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 32px 90px;
}

/* ---------- Nav ---------- */

nav.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 32px 0;
  max-width: 1240px;
  margin: 0 auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand img {
  height: 40px;
  width: auto;
  display: block;
}

.brand-name {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--ink-soft);
  line-height: 1.25;
}

.nav-label {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: .035em;
  color: var(--ink-faint);
}

/* ---------- Hero ---------- */

.hero {
  position: relative;
  isolation: isolate;
  perspective: 1000px;
  min-height: 690px;
  margin: 16px -32px 0;
  overflow: hidden;
  border-radius: 30px;
  background:
    radial-gradient(ellipse 42% 36% at 48% 51%, rgba(255,255,255,.98), transparent 90%),
    radial-gradient(ellipse 33% 27% at 52% 80%, rgba(255,210,174,.46), transparent 95%),
    radial-gradient(ellipse 35% 29% at 28% 47%, rgba(218,231,243,.57), transparent 95%),
    radial-gradient(ellipse 30% 35% at 82% 35%, rgba(225,219,245,.45), transparent 95%),
    linear-gradient(180deg, #eef0f0 0%, #f9f9f7 59%, #f1f0ec 100%);
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .48;
  background: radial-gradient(ellipse at 50% 45%, transparent 39%, rgba(90,101,107,.12) 100%);
}

.hero-tile {
  position: absolute;
  z-index: 2;
  display: block;
  width: var(--size);
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 10px;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  cursor: grab;
  touch-action: none;
  transform: translate3d(0, var(--scroll-y, 0px), 0) rotate(var(--angle));
  transition: filter .25s ease, scale .25s ease;
  will-change: transform;
}
.hero-tile:hover, .hero-tile:focus-visible { scale: 1.07; z-index: 6; }
.hero-tile:focus-visible { outline: 3px solid #292929; outline-offset: 5px; }
.hero-tile.dragging { cursor: grabbing; scale: 1.09; z-index: 7; }
.hero-tile .tilt {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: inherit;
  transform-style: preserve-3d;
  transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
  transition: transform .62s cubic-bezier(.18,.7,.2,1), box-shadow .62s ease;
  box-shadow: 0 24px 44px -18px rgba(27,34,40,.32), 0 5px 10px rgba(27,34,40,.12);
  will-change: transform;
}
.hero-tile.dragging .tilt { transition: none; }
.hero-tile .float {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: inherit;
  overflow: hidden;
  animation: float-tile var(--duration, 5s) ease-in-out var(--delay, 0s) infinite alternate;
}
.hero-tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
@keyframes float-tile { from { transform: translate3d(0,-8px,8px); } to { transform: translate3d(0,10px,8px); } }
.hero-tile.t1 { --size: 154px; --angle: -15deg; --duration: 5.2s; top: 78px; left: 1%; }
.hero-tile.t2 { --size: 116px; --angle: 8deg; --duration: 6.3s; --delay: -1.8s; top: 10px; left: 24%; }
.hero-tile.t3 { --size: 122px; --angle: 11deg; --duration: 5.8s; --delay: -3s; top: 335px; left: 2%; }
.hero-tile.t4 { --size: 135px; --angle: -12deg; --duration: 6.6s; --delay: -2.2s; bottom: 26px; left: 17%; }
.hero-tile.t5 { --size: 150px; --angle: 18deg; --duration: 5.7s; --delay: -2.5s; top: 70px; right: 2%; }
.hero-tile.t6 { --size: 105px; --angle: -8deg; --duration: 6.2s; --delay: -1s; top: 8px; right: 24%; }
.hero-tile.t7 { --size: 128px; --angle: -9deg; --duration: 5.4s; --delay: -3.1s; top: 350px; right: 2%; }
.hero-tile.t8 { --size: 130px; --angle: 12deg; --duration: 6.4s; --delay: -1.2s; bottom: 20px; right: 18%; }

@media (prefers-reduced-motion: reduce) {
  .hero-tile .float { animation: none; }
}

.hero-center {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
  padding: 105px 20px 70px;
}
.hero-kicker {
  font-family: 'Work Sans', system-ui, sans-serif;
  font-style: italic;
  font-weight: 550;
  font-size: clamp(16px, 1.8vw, 22px);
  color: #595958;
  margin-bottom: 18px;
  animation: fade-up .6s cubic-bezier(.2,.7,.2,1) backwards;
}

h1.title {
  font-family: 'Work Sans', system-ui, sans-serif;
  font-weight: 800;
  font-size: clamp(58px, 7.2vw, 96px);
  line-height: .98;
  letter-spacing: -.065em;
  margin: 0;
  text-wrap: balance;
  color: var(--ink);
  animation: fade-up .7s cubic-bezier(.2,.7,.2,1) backwards;
  animation-delay: .08s;
}

.hero-note {
  font-size: 15px;
  color: var(--ink-soft);
  max-width: 36ch;
  line-height: 1.55;
  margin: 24px auto 0;
  animation: fade-up .7s cubic-bezier(.2,.7,.2,1) backwards;
  animation-delay: .16s;
}
.hero-action {
  display: inline-flex;
  align-items: center;
  gap: 20px;
  margin-top: 22px;
  padding: 12px 18px;
  border: 1px solid #3a3936;
  border-radius: 999px;
  color: var(--ink);
  background: rgba(255,255,255,.58);
  text-decoration: none;
  font-size: 12px;
  font-weight: 700;
  pointer-events: auto;
  transition: background .2s, transform .2s;
}
.hero-action:hover, .hero-action:focus-visible { background: #fff; transform: translateY(-2px); }
@keyframes fade-up {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .hero-kicker, h1.title, .hero-note { animation: none; }
}

/* ---------- Glass components ---------- */

.glass {
  background: linear-gradient(155deg, rgba(255,255,255,.91), rgba(255,255,255,.46) 60%, rgba(230,235,239,.54));
  backdrop-filter: blur(22px) saturate(145%);
  -webkit-backdrop-filter: blur(22px) saturate(145%);
  border: 1px solid var(--glass-line);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -1px 2px rgba(111,125,135,.13),
    0 12px 28px -14px rgba(39,54,61,.23),
    0 2px 6px rgba(39,54,61,.08);
}

.glass-dark {
  background: linear-gradient(160deg, #4d5d63, #243137 75%);
  border: 1px solid rgba(255,255,255,.5);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.32),
    inset 0 -2px 4px rgba(0,0,0,.15),
    0 10px 22px -10px rgba(29,44,50,.46);
  color: #fff;
}

/* ---------- Controls ---------- */

.controls {
  position: sticky;
  top: 18px;
  z-index: 20;
  margin: 54px 0 34px;
  border-radius: 22px;
  padding: 12px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

.search-box {
  position: relative;
  flex: 1 1 220px;
  min-width: 180px;
}

.search-box input {
  width: 100%;
  background: transparent;
  border: none;
  color: var(--ink);
  font-family: 'Work Sans', sans-serif;
  font-size: 14px;
  font-weight: 550;
  padding: 10px 12px 10px 34px;
  outline: none;
}

.search-box input::placeholder { color: var(--ink-faint); }

.search-box svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  stroke: var(--ink-faint);
  pointer-events: none;
}

.vsep {
  width: 1px;
  align-self: stretch;
  background: var(--glass-line);
  margin: 4px 0;
}

select#artistFilter {
  background: transparent;
  border: none;
  color: var(--ink);
  font-family: 'Work Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 650;
  padding: 10px 8px;
  outline: none;
  min-width: 168px;
  cursor: pointer;
}

.genre-scroll {
  display: flex;
  gap: 11px;
  overflow-x: auto;
  padding: 5px 20px 10px 2px;
  margin: 10px -2px 0;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  mask-image: linear-gradient(90deg, #000 92%, transparent 100%);
  -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent 100%);
}
.genre-scroll::-webkit-scrollbar { display: none; }

.chip {
  font-family: 'Work Sans', system-ui, sans-serif;
  font-size: 13px;
  font-weight: 650;
  letter-spacing: -.01em;
  padding: 12px 19px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease, color .22s ease, background .22s ease;
  color: var(--ink-soft);
  flex: 0 0 auto;
  -webkit-tap-highlight-color: transparent;
}

.chip:hover { transform: translateY(-3px); color: var(--ink); box-shadow: inset 0 1px 0 #fff, 0 14px 26px -12px rgba(39,54,61,.3), 0 3px 8px rgba(39,54,61,.1); }
.chip:active { transform: translateY(0) scale(.96); }

.chip.active { color: #fff; font-weight: 700; }
.chip:focus-visible, .hero-action:focus-visible, select#artistFilter:focus-visible, .modal-close:focus-visible { outline: 2px solid #35484d; outline-offset: 3px; }

/* ---------- Grid ---------- */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 26px 20px;
}

.card {
  cursor: pointer;
  opacity: 0;
  transform: translateY(22px);
  transition: opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1);
  -webkit-tap-highlight-color: transparent;
}

.card.in-view {
  opacity: 1;
  transform: translateY(0);
}

.card:active .sleeve { transform: scale(.97); }
.sleeve { transition: transform .18s cubic-bezier(.2,.8,.2,1); }

@media (prefers-reduced-motion: reduce) {
  .card { opacity: 1; transform: none; transition: none; }
}

.sleeve {
  position: relative;
  aspect-ratio: 1;
  border-radius: 6px;
  overflow: visible;
}

.sleeve .disc {
  position: absolute;
  top: 4%;
  right: -6%;
  width: 92%;
  height: 92%;
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle at 50% 50%,
      #1c1a16 0px, #1c1a16 2px,
      #2c2822 2px, #2c2822 4px);
  box-shadow: 0 8px 20px var(--shadow-strong);
  transition: transform .32s cubic-bezier(.2,.8,.2,1);
  z-index: 1;
}

.sleeve .disc::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 26%; height: 26%;
  background: var(--paper);
  border-radius: 50%;
  transform: translate(-50%,-50%);
}

.sleeve .disc::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 5%; height: 5%;
  background: #1c1a16;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  z-index: 2;
}

.sleeve .cover {
  position: absolute;
  inset: 0;
  border-radius: 6px;
  overflow: hidden;
  z-index: 2;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: 0 14px 26px -14px var(--shadow-strong), 0 2px 5px var(--shadow-soft);
  transition: transform .32s cubic-bezier(.2,.8,.2,1), box-shadow .32s ease;
}

.sleeve .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

.sleeve .cover.placeholder {
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  gap: 6px; padding: 10px; text-align: center; background: var(--paper-alt);
}

.sleeve .cover.placeholder svg { width: 28px; height: 28px; stroke: var(--ink-faint); opacity: .7; }

.sleeve .cover.placeholder span {
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-faint);
  letter-spacing: .04em;
  line-height: 1.3;
}

.card:hover .sleeve .cover { transform: translateX(-13%) rotate(-1.5deg); box-shadow: 0 22px 34px -16px var(--shadow-strong); }
.card:hover .sleeve .disc { transform: translateX(13%) rotate(22deg); }

@media (prefers-reduced-motion: reduce) {
  .card:hover .sleeve .cover, .card:hover .sleeve .disc { transform: none; }
}

.meta { margin-top: 12px; padding-right: 4px; }

.meta .a {
  font-size: 14px; font-weight: 750; color: var(--ink); line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.meta .b {
  font-size: 12.5px; font-weight: 500; color: var(--ink-soft); line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
}

.meta .g {
  font-size: 10.5px; font-weight: 650; text-transform: uppercase;
  letter-spacing: .055em; color: var(--ink-faint); margin-top: 7px;
}

.empty-state {
  grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--ink-faint);
  font-size: 13.5px; font-weight: 600;
}

/* ---------- Modal ---------- */

.overlay {
  position: fixed; inset: 0;
  background: rgba(38,49,53,.34);
  backdrop-filter: blur(12px) saturate(120%);
  -webkit-backdrop-filter: blur(12px) saturate(120%);
  z-index: 100; display: none;
  align-items: flex-start; justify-content: center;
  padding: 6vh 20px; overflow-y: auto;
}

.overlay.open { display: flex; }

.modal {
  border-radius: 25px;
  max-width: 640px; width: 100%;
  padding: 34px;
  position: relative;
  animation: pop .22s cubic-bezier(.2,.8,.2,1);
  background:
    radial-gradient(ellipse 55% 35% at 85% 8%, rgba(213,227,244,.56), transparent 90%),
    radial-gradient(ellipse 45% 30% at 15% 87%, rgba(255,220,193,.42), transparent 90%),
    linear-gradient(155deg, rgba(255,255,255,.97), rgba(248,249,249,.9));
  box-shadow: 0 32px 80px -26px rgba(17,31,38,.36), inset 0 1px 0 #fff;
}

@keyframes pop {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) { .modal { animation: none; } }

.modal-close {
  position: absolute; top: 14px; right: 14px;
  width: 40px; height: 40px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 20px; line-height: 1; color: var(--ink-soft);
  transition: transform .15s cubic-bezier(.2,.8,.2,1);
  -webkit-tap-highlight-color: transparent;
}
.modal-close:hover { color: var(--ink); transform: scale(1.06); }
.modal-close:active { transform: scale(.92); }

.modal-top { display: flex; gap: 22px; margin-bottom: 22px; }

.modal-cover {
  width: 140px; height: 140px; flex: 0 0 auto; border-radius: 8px; overflow: hidden;
  box-shadow: 0 14px 28px -12px var(--shadow-strong); background: var(--paper-alt);
}
.modal-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.modal-cover.placeholder { display: flex; align-items: center; justify-content: center; }
.modal-cover.placeholder svg { width: 38px; height: 38px; stroke: var(--ink-faint); opacity: .5; }

.modal-info { padding-top: 4px; }

.modal-genre {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; color: var(--ink-soft); margin-bottom: 8px;
}

.modal-album {
  font-family: 'Work Sans', system-ui, sans-serif; font-weight: 800; font-size: 29px; line-height: 1.05;
  letter-spacing: -.045em;
  margin: 0 0 6px; text-wrap: balance; color: var(--ink);
}

.modal-artist { font-size: 15px; font-weight: 600; color: var(--ink-soft); margin: 0; }
.modal-year { font-size: 12px; font-weight: 600; color: var(--ink-faint); margin-top: 8px; }

.tracklist-label {
  font-size: 11px; font-weight: 750; text-transform: uppercase;
  letter-spacing: .075em; color: var(--ink-faint); border-top: 1px solid var(--line);
  padding-top: 18px; margin-bottom: 8px;
}

.tracklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }

.tracklist li {
  display: flex; gap: 12px; padding: 10px 4px; font-size: 13.5px; font-weight: 500;
  border-bottom: 1px dashed var(--line); color: var(--ink);
}
.tracklist li:hover { background: rgba(255,255,255,.35); }
.tracklist li:last-child { border-bottom: none; }

.tracklist .n {
  font-weight: 700; color: var(--ink-faint);
  font-variant-numeric: tabular-nums; width: 20px; flex: 0 0 auto;
}

.no-data {
  border-top: 1px solid var(--line); padding-top: 18px; font-size: 13.5px;
  color: var(--ink-soft); line-height: 1.6;
}
.no-data b { color: var(--ink); }

footer {
  text-align: center;
  padding: 50px 0 10px;
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

@media (max-width: 720px) {
  .wrap { padding: 0 18px 70px; }
  nav.top { padding: 18px 18px 0; }
  .brand img { height: 34px; }
  .brand-name { font-size: 10px; }
  .nav-label { display: none; }

  .hero {
    height: 690px;
    min-height: 0;
    margin: 16px -18px 0;
    border-radius: 22px;
  }
  .hero-tile.t1 { --size: 104px; top: 58px; left: -22px; }
  .hero-tile.t2 { --size: 76px; top: 18px; left: 34%; }
  .hero-tile.t3 { --size: 92px; top: 195px; left: -24px; }
  .hero-tile.t4 { --size: 105px; bottom: 66px; left: 3%; }
  .hero-tile.t5 { --size: 99px; top: 71px; right: -20px; }
  .hero-tile.t6 { --size: 72px; top: 15px; right: 26%; }
  .hero-tile.t7 { --size: 88px; top: 211px; right: -20px; }
  .hero-tile.t8 { --size: 101px; bottom: 61px; right: 3%; }
  .hero-center { padding: 140px 20px 85px; }
  .hero-kicker { font-size: 17px; margin-bottom: 13px; }
  h1.title { font-size: clamp(44px, 10vw, 64px); }
  .hero-note { font-size: 13px; max-width: 30ch; margin-top: 17px; }
  .hero-action { margin-top: 17px; }

  .controls { position: sticky; top: 10px; margin: 30px 0 22px; padding: 10px 12px; flex-wrap: nowrap; }
  select#artistFilter { min-width: 0; max-width: 96px; }

  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; }

  .modal { padding: 24px 20px; border-radius: 18px 18px 0 0; }
  .overlay { padding: 0; align-items: flex-end; }
  .overlay .modal { max-height: 92vh; overflow-y: auto; animation: sheet-up .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes sheet-up { from { transform: translateY(24px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  .modal-top { gap: 16px; }
  .modal-cover { width: 104px; height: 104px; }
  .modal-album { font-size: 23px; }
}
</style>
</head>
<body>


<nav class="top">
  <div class="brand">
    <img src="assets/img/logo-11496d72.png" alt="Café de Ley">
    <div class="brand-name">Caf&eacute; de Ley<br>Lab &amp; Estudio de Caf&eacute;</div>
  </div>
  <div class="nav-label">Inventario f&iacute;sico</div>
</nav>

<div class="wrap">
  <div class="hero" aria-label="Discos destacados">
    <button class="hero-tile t1" type="button" data-cover="the-beatles--1-2015.jpg" aria-label="Ver 1 de The Beatles"><span class="tilt"><span class="float"><img alt="" draggable="false"></span></span></button>
    <button class="hero-tile t2" type="button" data-cover="the-simpsons--songs-in-the-key-of-springfield.jpg" aria-label="Ver Songs in the Key of Springfield de The Simpsons"><span class="tilt"><span class="float"><img alt="" draggable="false"></span></span></button>
    <button class="hero-tile t3" type="button" data-cover="the-rolling-stones--foreign-tongues.jpg" aria-label="Ver Foreign Tongues de The Rolling Stones"><span class="tilt"><span class="float"><img alt="" draggable="false"></span></span></button>
    <button class="hero-tile t4" type="button" data-cover="juan-gabriel--en-el-palacio-de-bellas-artes.jpg" aria-label="Ver En el Palacio de Bellas Artes de Juan Gabriel"><span class="tilt"><span class="float"><img alt="" draggable="false"></span></span></button>
    <button class="hero-tile t5" type="button" data-cover="eagles--hotel-california.jpg" aria-label="Ver Hotel California de Eagles"><span class="tilt"><span class="float"><img alt="" draggable="false"></span></span></button>
    <button class="hero-tile t6" type="button" data-cover="the-beatles--revolver-2022-picture-disc.jpg" aria-label="Ver Revolver Picture Disc de The Beatles"><span class="tilt"><span class="float"><img alt="" draggable="false"></span></span></button>
    <button class="hero-tile t7" type="button" data-cover="daft-punk--random-access-memories.jpg" aria-label="Ver Random Access Memories de Daft Punk"><span class="tilt"><span class="float"><img alt="" draggable="false"></span></span></button>
    <button class="hero-tile t8" type="button" data-cover="rosalia--motomami.jpg" aria-label="Ver MOTOMAMI de Rosalía"><span class="tilt"><span class="float"><img alt="" draggable="false"></span></span></button>
    <div class="hero-center">
      <div class="hero-kicker">Una colección para descubrir.</div>
      <h1 class="title">Colección de<br>Vinilos</h1>
      <p class="hero-note">Explora los discos de Café de Ley. Toca una portada para conocer su música.</p>
      <a class="hero-action" href="#catalogo">Explorar colección <span aria-hidden="true">↗</span></a>
    </div>
  </div>

  <div class="controls glass" id="catalogo">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar por artista o disco&hellip;" autocomplete="off">
    </div>
    <div class="vsep"></div>
    <select id="artistFilter"><option value="">Todos los artistas</option></select>
  </div>
  <div class="genre-scroll" id="genreRow"></div>

  <div class="grid" id="grid" style="margin-top:30px;"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal glass" id="modalBody"></div>
</div>

<footer>Caf&eacute; de Ley &mdash; Lab &amp; Estudio de Caf&eacute; &middot; Uso interno</footer>

<script>
const RECORDS = /*__RECORDS__*/[];
const GENRES = ["Alternative", "Electronic", "Hard Rock", "Hip-Hop/Rap", "Latin", "Original Score", "Pop", "Pop Latino", "R&B/Soul", "Reggae", "Rock", "Rock y Alternativo", "Soundtrack", "Urbano latino", "Vocal"];

const grid = document.getElementById('grid');
const genreRow = document.getElementById('genreRow');
const artistFilter = document.getElementById('artistFilter');
const searchInput = document.getElementById('searchInput');
const overlay = document.getElementById('overlay');
const modalBody = document.getElementById('modalBody');

let activeGenre = '';

const artists = [...new Set(RECORDS.map(r => r.artist))].sort((a,b) => a.localeCompare(b, 'es'));
for (const a of artists) {
  const opt = document.createElement('option');
  opt.value = a; opt.textContent = a;
  artistFilter.appendChild(opt);
}

function makeChip(label, value) {
  const b = document.createElement('button');
  b.className = 'chip glass' + (value === activeGenre ? ' active glass-dark' : '');
  b.textContent = label;
  b.dataset.value = value;
  b.addEventListener('click', () => {
    activeGenre = value;
    document.querySelectorAll('.chip').forEach(c => {
      const isActive = c.dataset.value === value;
      c.classList.toggle('active', isActive);
      c.classList.toggle('glass-dark', isActive);
    });
    render();
  });
  return b;
}

genreRow.appendChild(makeChip('Todos', ''));
for (const g of GENRES) genreRow.appendChild(makeChip(g, g));

const placeholderSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/></svg>';

let revealObserver = null;
function getRevealObserver() {
  if (revealObserver) return revealObserver;
  revealObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        revealObserver.unobserve(entry.target);
      }
    }
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  return revealObserver;
}

function cardHtml(r, i) {
  const coverInner = r.cover
    ? `<div class="cover"><img src="covers/${r.cover}" alt="${r.album}" loading="lazy"></div>`
    : `<div class="cover placeholder">${placeholderSvg}<span>SIN FICHA<br>${r.artist.slice(0,18)}</span></div>`;
  return `<div class="card" data-i="${i}">
    <div class="sleeve"><div class="disc"></div>${coverInner}</div>
    <div class="meta">
      <div class="a">${r.artist}</div>
      <div class="b">${r.album}</div>
      ${r.genre ? `<div class="g">${r.genre}${r.year ? ' &middot; ' + r.year : ''}</div>` : (r.found ? '' : '<div class="g">Pendiente de datos</div>')}
    </div>
  </div>`;
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const artistSel = artistFilter.value;
  const filtered = RECORDS.filter(r => {
    if (activeGenre && r.genre !== activeGenre) return false;
    if (artistSel && r.artist !== artistSel) return false;
    if (q && !(r.artist.toLowerCase().includes(q) || r.album.toLowerCase().includes(q))) return false;
    return true;
  });
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state">Ning\u00fan disco coincide con ese filtro.</div>';
    return;
  }
  grid.innerHTML = filtered.map((r) => cardHtml(r, RECORDS.indexOf(r))).join('');
  const observer = getRevealObserver();
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openModal(RECORDS[card.dataset.i]));
    if (reduceMotion) {
      card.classList.add('in-view');
    } else {
      observer.observe(card);
    }
  });
}

function openModal(r) {
  const cover = r.cover
    ? `<div class="modal-cover"><img src="covers/${r.cover}" alt="${r.album}"></div>`
    : `<div class="modal-cover placeholder">${placeholderSvg}</div>`;
  const noDataMsg = r.note
    ? `<div class="no-data"><b>Sin ficha digital.</b><br>${r.note}</div>`
    : `<div class="no-data"><b>Sin ficha completa todav\u00eda.</b><br>Confirma artista y nombre exacto del disco en el excel para poder traer portada y tracklist autom\u00e1ticamente.</div>`;
  const tracks = r.tracks && r.tracks.length
    ? `<div class="tracklist-label">Tracklist &mdash; ${r.tracks.length} canciones</div>
       <ul class="tracklist">${r.tracks.map((t,i) => `<li><span class="n">${String(i+1).padStart(2,'0')}</span><span>${t}</span></li>`).join('')}</ul>`
    : noDataMsg;
  modalBody.innerHTML = `
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-top">
      ${cover}
      <div class="modal-info">
        ${r.genre ? `<div class="modal-genre">${r.genre}</div>` : ''}
        <h2 class="modal-album">${r.album}</h2>
        <p class="modal-artist">${r.artist}</p>
        ${r.year ? `<div class="modal-year">${r.year}</div>` : ''}
      </div>
    </div>
    ${tracks}
  `;
  overlay.classList.add('open');
  document.getElementById('modalClose').addEventListener('click', closeModal);
}

function closeModal() { overlay.classList.remove('open'); }
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

searchInput.addEventListener('input', render);
artistFilter.addEventListener('change', render);

const hero = document.querySelector('.hero');
const heroTiles = [...hero.querySelectorAll('.hero-tile')];
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
heroTiles.forEach((tile, index) => {
  const record = RECORDS.find(r => r.cover === tile.dataset.cover);
  tile.querySelector('img').src = COVER_URIS[tile.dataset.cover];
  let pointer = null;
  let suppressClick = false;
  const clamp = (value, limit) => Math.max(-limit, Math.min(limit, value));
  const tilt = (x, y) => {
    tile.style.setProperty('--tilt-x', `${x}deg`);
    tile.style.setProperty('--tilt-y', `${y}deg`);
  };
  tile.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    suppressClick = false;
    pointer = { id: event.pointerId, x: event.clientX, y: event.clientY, dragged: false };
    tile.setPointerCapture(event.pointerId);
  });
  tile.addEventListener('pointermove', event => {
    if (pointer && event.pointerId === pointer.id) {
      const dx = event.clientX - pointer.x;
      const dy = event.clientY - pointer.y;
      if (Math.hypot(dx, dy) > 7) pointer.dragged = true;
      if (pointer.dragged) {
        tile.classList.add('dragging');
        tilt(clamp(-dy * .38, 38), clamp(dx * .38, 38));
      }
    } else if (!pointer && event.pointerType === 'mouse') {
      const rect = tile.getBoundingClientRect();
      const nx = (event.clientX - rect.left) / rect.width * 2 - 1;
      const ny = (event.clientY - rect.top) / rect.height * 2 - 1;
      tilt(clamp(-ny * 11, 11), clamp(nx * 11, 11));
    }
  });
  tile.addEventListener('pointerup', event => {
    if (!pointer || event.pointerId !== pointer.id) return;
    suppressClick = pointer.dragged;
    pointer = null;
    tile.classList.remove('dragging');
    tilt(0, 0);
  });
  tile.addEventListener('pointercancel', () => {
    pointer = null;
    suppressClick = false;
    tile.classList.remove('dragging');
    tilt(0, 0);
  });
  tile.addEventListener('pointerleave', () => { if (!pointer) tilt(0, 0); });
  tile.addEventListener('click', event => {
    if (suppressClick) { event.preventDefault(); suppressClick = false; return; }
    if (record) openModal(record);
  });
});

let scrollFrame = 0;
function updateHeroScroll() {
  scrollFrame = 0;
  if (prefersReducedMotion.matches) return;
  const amount = Math.min(Math.max(window.scrollY, 0), 720);
  heroTiles.forEach((tile, index) => {
    const speed = [-.07, .04, -.11, .08, .09, -.05, .12, -.08][index];
    tile.style.setProperty('--scroll-y', `${Math.round(amount * speed)}px`);
  });
}
window.addEventListener('scroll', () => {
  if (!scrollFrame) scrollFrame = requestAnimationFrame(updateHeroScroll);
}, { passive: true });
updateHeroScroll();

render();
</script>

</body>
</html>
